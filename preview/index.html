<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
</head>
<body>
<title>Oakfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Gloock&family=Plus+Jakarta+Sans:wght@700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: the Oakfall desk. Top bar (lights above, lockup with Gall as the l, controls), then binder | page | inspector. */
:root{
  --desk:#e4e1da;--card:#ffffff;--card2:#f7f6f2;--ink:#1a1b20;--mid:#5e6068;--dim:#9a9ca3;--line:#d6d3cb;--accent:#5e8a5c;--onaccent:#ffffff;
  --red:#e2574a;--blue:#3e6fd9;--green:#3f9a5b;--gold:#c9a24a;--tour-dim:rgb(14 16 24/.72);--tour-card:#10131c;--tour-glow:#8fbf7a;
  --font-ui:"DM Sans",system-ui,-apple-system,sans-serif;--font-display:"Gloock",Georgia,serif;--font-body:"Newsreader","Iowan Old Style",Georgia,serif;--font-brand:"Plus Jakarta Sans","DM Sans",sans-serif;
  --gap:14px;--radius:12px;--page-size:17.5px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font-ui);font-size:13.5px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;background:var(--desk);color:var(--ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px;position:relative;overflow:hidden}
/* modes */
.app[data-mode="dark"]{--desk:#1b1e24;--card:#262a33;--card2:#2e333d;--ink:#eceef2;--mid:#a3a8b3;--dim:#6b7180;--line:#3a3f4a;--accent:#8fbf7a;--onaccent:#14200f;--red:#ef7a6b;--blue:#7d9ae8;--green:#8fbf7a}
.app[data-look="dusk"]{--accent:#2d4fd6;--tour-glow:#7d93ff}
.app[data-look="dusk"][data-mode="dark"]{--desk:#0a0e33;--card:#10164a;--card2:#151c5a;--ink:#eef0ff;--mid:#a6afe6;--dim:#6b75b8;--line:#2a3380;--accent:#7d93ff;--onaccent:#0a0e33}
.app[data-look="harvest"]{--desk:#e9dfcd;--card:#fbf5e9;--card2:#f3e9d6;--ink:#2a1a10;--mid:#6b5440;--dim:#a08c75;--line:#d8c8ac;--accent:#b4491b;--tour-glow:#e0864f}
.app[data-look="harvest"][data-mode="dark"]{--desk:#1f1611;--card:#2a1f18;--card2:#33261d;--ink:#f1e6d6;--mid:#c2ad97;--dim:#7d6a58;--line:#45352a;--accent:#e0864f;--onaccent:#1f1611}
.app[data-look="irongall"]{--accent:#4c6a9a;--tour-glow:#7fa7e8}
.app[data-look="irongall"][data-mode="dark"]{--desk:#171c27;--card:#1e2432;--card2:#262d3b;--ink:#f3f4f1;--mid:#a5a9b0;--dim:#6a7080;--line:#3a4150;--accent:#7fa7e8;--onaccent:#171c27}
.app[data-look="vellum"]{--desk:#ece5d3;--card:#f9f5ea;--card2:#f1ebdb;--ink:#2b2416;--mid:#6e6450;--dim:#a39a86;--line:#d9d0ba;--accent:#8c6a2e;--tour-glow:#c9a24a}
.app[data-look="vellum"][data-mode="dark"]{--desk:#1c1913;--card:#26221a;--card2:#2f2a20;--ink:#efe8d8;--mid:#b3a88f;--dim:#766d5a;--line:#403a2c;--accent:#c9a24a;--onaccent:#1c1913}
.app[data-layout="classic"]{--gap:0px;--radius:0px}
.app[data-focus="1"]{--desk:#141414;--card:#141414;--card2:#1c1c1c;--ink:#e9e6df;--mid:#8a867e;--dim:#4a4742;--line:#262522}
/* top bar */
.top{flex:none;padding-top:14px}
.lights{display:flex;gap:7px;height:12px}.lights i{width:12px;height:12px;border-radius:50%;display:block;background:var(--line)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.bar{display:flex;align-items:center;gap:14px;padding:12px 0 12px;flex-wrap:wrap}
.word{font-family:var(--font-brand);font-weight:700;font-size:24px;letter-spacing:-.04em;line-height:1;display:inline-flex;align-items:flex-end;color:var(--ink);white-space:nowrap}
.leafl{display:inline-block;width:.62em;height:.98em;margin:0 -.02em 0 .02em;color:var(--gall,var(--ink));position:relative;perspective:200px}
.leafl svg{width:100%;height:100%;overflow:visible;display:block}
.leafl .home{transform-origin:50% 60%;transform-box:fill-box}
.leafl.flip .home{animation:turn 1.4s ease-in-out}
@keyframes turn{0%{transform:rotateY(0)}45%{transform:rotateY(180deg) rotate(8deg)}100%{transform:rotateY(360deg)}}
.leafl .ghost{opacity:0;transition:opacity .3s}.leafl.away .home{opacity:0}.leafl.away .ghost{opacity:.5}
.eyes-closed .open{display:none}.lids{display:none}.eyes-closed .lids{display:inline}
.mouth{display:none}.smiling .mouth{display:inline}.smiling .hole{display:none}
.proj{color:var(--mid);padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.rib{display:flex;gap:2px}
.icon-b{appearance:none;border:0;background:transparent;color:var(--mid);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.icon-b:hover{background:var(--card);color:var(--ink)}.icon-b .fillpane{opacity:0;transition:opacity .15s}.icon-b.on{color:var(--ink)}.icon-b.on .fillpane{opacity:.28}
.right{margin-left:auto;display:flex;gap:6px;align-items:center}
.search{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 10px 7px 12px;color:var(--mid);width:230px;text-align:left}
.search span{flex:1}.search kbd,.kbd{font:11px var(--font-ui);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--dim)}
.ib{appearance:none;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--mid)}
.ib:hover{color:var(--ink)}.ib.on{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.app[data-layout="classic"] .search,.app[data-layout="classic"] .ib{border-radius:0;background:transparent}
.app[data-focus="1"] .rib,.app[data-focus="1"] .search,.app[data-focus="1"] .ib:not(#btn-focus),.app[data-focus="1"] .proj{display:none}
.app[data-focus="1"] .word{color:var(--dim)}.app[data-focus="1"] .leafl{color:var(--dim)}
/* grid */
.grid{flex:1;min-height:0;display:grid;gap:var(--gap);grid-template-columns:300px minmax(0,1fr) 280px}
.grid.no-binder{grid-template-columns:0 minmax(0,1fr) 280px}.grid.no-insp{grid-template-columns:300px minmax(0,1fr) 0}.grid.no-binder.no-insp{grid-template-columns:0 minmax(0,1fr) 0}
.grid.no-binder #binder,.grid.no-insp #inspector{display:none}
.app[data-focus="1"] .grid{grid-template-columns:minmax(0,1fr)}.app[data-focus="1"] #binder,.app[data-focus="1"] #inspector,.app[data-focus="1"] .tabs{display:none}
.mod{min-height:0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.app[data-layout="classic"] .grid{border:1px solid var(--line);background:var(--card)}
.app[data-layout="classic"] .mod{border:0;background:transparent}
.app[data-layout="classic"] #binder{border-right:1px solid var(--line)}.app[data-layout="classic"] #inspector{border-left:1px solid var(--line)}
.app[data-focus="1"] .mod{border:0;background:transparent}
.hd{flex:none;display:flex;align-items:baseline;gap:8px;padding:12px 14px 6px;font-size:11.5px;color:var(--mid)}.hd b{color:var(--ink);font-weight:600}
.app[data-layout="classic"] .hd{font-family:"Fraunces",serif;font-style:italic;font-size:13px}.app[data-layout="classic"] .hd b{font-weight:400}
.scroll{flex:1;min-height:0;overflow:auto;padding:4px 10px 14px}
/* binder */
.proj-row{display:flex;align-items:baseline;justify-content:space-between;padding:4px 6px 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.proj-row b{font-family:var(--font-display);font-weight:400;font-size:18px}.proj-row small{color:var(--mid);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer;user-select:none}
.row:hover{background:var(--card2)}.row.on{background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 2px 0 0 var(--accent)}
.row .tw{width:12px;color:var(--dim);font-size:10px;text-align:center;flex:none;transition:transform .15s}.row.closed .tw{transform:rotate(-90deg)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.folder .nm{font-weight:600}
.row .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--dim)}
.pill{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--mid);white-space:nowrap}
.pill.todo{color:var(--dim)}.pill.draft{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}.pill.revised{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}.pill.done{color:var(--onaccent);background:var(--accent);border-color:var(--accent)}
.wc{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.kids.closed{display:none}
/* sheet */
.tabs{flex:none;display:flex;align-items:flex-end;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;min-height:41px}
.tab{appearance:none;border:1px solid var(--line);border-bottom:0;background:var(--card2);color:var(--mid);display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;border-radius:10px 10px 0 0;cursor:pointer;max-width:24ch;transform:translateY(1px);white-space:nowrap}
.tab.on{background:var(--card);color:var(--ink);font-weight:600}
.tab i{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}.tab.on i{background:var(--accent)}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab .x{border:0;background:transparent;color:var(--dim);cursor:pointer;padding:0 3px;border-radius:4px;font-size:15px;line-height:1}.tab .x:hover{color:var(--ink);background:var(--line)}
.app[data-layout="classic"] .tab{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;font-family:"Fraunces",serif;transform:none}.app[data-layout="classic"] .tab.on{box-shadow:inset 0 -2px 0 var(--accent);font-weight:500}
.page{flex:1;min-height:0;overflow:auto}
.page-in{max-width:calc(62ch + 112px);margin:0 auto;padding:36px 56px 30vh}
.app[data-focus="1"] .page-in{padding-top:90px}
.page h1{font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1.08;margin:0 0 .3em;text-wrap:balance}
.app[data-layout="classic"] .page h1{font-family:"Fraunces",serif;font-weight:300;font-size:44px}
.app[data-focus="1"] .page h1{font-size:22px;color:var(--mid);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.4em}.chips span{background:var(--card2);border-radius:999px;padding:3px 10px;color:var(--mid)}
.app[data-layout="classic"] .chips span{background:transparent;padding:0;font-family:"Fraunces",serif;font-style:italic}.app[data-layout="classic"] .chips span+span::before{content:"·";margin-right:8px;color:var(--dim)}
.app[data-focus="1"] .chips{justify-content:center}.app[data-focus="1"] .chips span{background:transparent}
.ed{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-family:var(--font-body);font-size:var(--page-size);line-height:1.68;padding:0;overflow:hidden;caret-color:var(--accent)}
.ed::placeholder{color:var(--dim);font-style:italic}
.empty{height:100%;display:grid;place-items:center;color:var(--dim);font-family:var(--font-body);font-size:16px;text-align:center;padding:20px}
/* inspector */
.ins h3{font-family:var(--font-display);font-weight:400;font-size:19px;margin:2px 4px 6px}
.ins .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:14px 4px 6px;font-weight:600}
.ins textarea,.ins select,.ins input{width:100%;font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:0}
.ins textarea{resize:vertical;min-height:64px;font-family:var(--font-body);font-size:15px;line-height:1.45}
.ins textarea:focus,.ins select:focus,.ins input:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.snap{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.snap b{display:block;font-weight:600}.snap small{color:var(--mid)}.snap em{position:absolute;right:10px;top:9px;font-style:normal;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.snap em.up{color:var(--green)}.snap em.down{color:var(--red)}
.snap .acts{display:none;gap:6px;margin-top:8px}.snap.open .acts{display:flex}
.btn{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
.btn.block{display:block;width:100%;border-radius:10px;padding:9px}
.muted{color:var(--mid);margin:4px;line-height:1.45}
/* modal */
.back{position:absolute;inset:0;z-index:40;background:color-mix(in srgb,var(--desk) 60%,transparent);display:grid;place-items:start center;padding:10vh 16px 16px}
.modal{width:min(560px,100%);max-height:70vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgb(0 0 0/.25);padding:12px}
.modal input{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card2);color:var(--ink);outline:0;margin-bottom:8px}
.modal input:focus{border-color:var(--accent)}
.list{overflow:auto;display:flex;flex-direction:column;gap:2px}
.item{appearance:none;border:0;background:transparent;text-align:left;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.item small{color:var(--dim)}.item.on,.item:hover{background:color-mix(in srgb,var(--accent) 13%,transparent)}
/* settings */
.set-back{place-items:center;padding:16px}
.settings{width:min(980px,100%);height:min(640px,100%);display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgb(0 0 0/.25);overflow:hidden}
.app[data-layout="classic"] .settings{border-radius:0}
.rail{background:var(--card2);border-right:1px solid var(--line);padding:14px 10px}
.rail h6{margin:4px 10px 10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.ri{appearance:none;border:0;background:transparent;width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mid);font-weight:500;cursor:pointer;text-align:left}
.ri.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.sbody{overflow:auto;padding:24px 32px}
.sbody h2{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0 0 4px}
.sub{color:var(--mid);margin:0 0 20px}
.grp{margin-bottom:22px}.grp>b{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;padding:7px 14px;border-radius:9px;color:var(--mid);font-weight:500;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.seg button.on{background:var(--accent);color:var(--onaccent)}
.cards{display:flex;flex-wrap:wrap;gap:12px}
.lc{appearance:none;cursor:pointer;text-align:left;width:180px;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--card2);display:flex;flex-direction:column}
.lc.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.lc span{margin-top:8px;font-weight:600}.lc small{color:var(--mid);line-height:1.35;margin-top:2px}
.th{height:80px;border-radius:8px;background:var(--desk);position:relative;overflow:hidden}
.th i{position:absolute;top:6px;bottom:6px;background:var(--card);border:1px solid var(--line);border-radius:5px}
.th.d .a{left:6px;width:26%}.th.d .b{left:31%;width:41%}.th.d .c{right:6px;width:22%}
.th.c{background:var(--card)}.th.c i{top:0;bottom:0;border:0;border-radius:0;background:transparent}.th.c .a{left:0;width:27%;border-right:1px solid var(--line)}.th.c .c{right:0;width:27%;border-left:1px solid var(--line)}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-width:660px}
.lk{appearance:none;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:7px;background:var(--card2);font-weight:500}
.lk.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.lk .sw{height:40px;border-radius:7px;position:relative;margin-bottom:6px}.lk .sw i{position:absolute;left:8px;top:8px;width:42%;height:6px;border-radius:3px}.lk .sw b{position:absolute;left:8px;top:19px;width:64%;height:6px;border-radius:3px;opacity:.5}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);max-width:560px}
.srow small{display:block;color:var(--mid);margin-top:2px}
.tg{appearance:none;border:0;cursor:pointer;width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex:none;padding:0}
.tg i{position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s}.tg.on{background:var(--accent)}.tg.on i{left:20px}
input[type=range]{accent-color:var(--accent);width:170px}
.colors{display:flex;gap:10px;flex-wrap:wrap}.colors button{appearance:none;cursor:pointer;width:28px;height:28px;border-radius:50%;border:0}.colors button.on{outline:2px solid var(--accent);outline-offset:3px}
.outfits{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-width:640px}
.of{appearance:none;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:8px 6px 8px;background:var(--card2);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500}
.of.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.of svg{width:58px;height:58px;color:var(--gall,var(--ink));overflow:visible}
/* toast */
.toasts{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--desk);padding:9px 16px;border-radius:999px;font-weight:500;box-shadow:0 10px 30px rgb(0 0 0/.2);transition:opacity .3s}
/* tour */
.tour{position:absolute;inset:0;z-index:50;pointer-events:none}.tour.on{pointer-events:auto}
.tour .dim{position:absolute;inset:0;background:var(--tour-dim)}.tour.lit .dim{background:transparent}
.cut{position:absolute;border-radius:12px;opacity:0;outline:2px solid var(--tour-glow);box-shadow:0 0 0 9999px var(--tour-dim);transition:left .45s,top .45s,width .45s,height .45s,opacity .3s;pointer-events:none}.tour.lit .cut{opacity:1}
.ring{position:absolute;border-radius:18px;border:1px solid color-mix(in srgb,var(--tour-glow) 45%,transparent);opacity:0;pointer-events:none}.tour.lit .ring{animation:pulse 1.1s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.025)}}
.tcard{position:absolute;width:320px;max-width:calc(100% - 24px);background:var(--tour-card);color:#fff;border-radius:12px;padding:14px 16px 12px;box-shadow:0 24px 60px rgb(0 0 0/.4);opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.tour.lit .tcard{opacity:1;transform:none}

ossing", "synopsis": "The ferryman will not take the letter.", "status": "First Draft", "label": "Mara", "date": "1898-03", "type": "text"}, "body": "The river was low. The ferryman at [[Stillwater]] would not take the letter and would not say why. The Harrow girl waited until dark."}, {"path": "Manuscript/02 Part Two/02 Buttons.md", "folder": "Manuscript/02 Part Two", "name": "Buttons", "fm": {"title": "Buttons", "synopsis": "Tom sells the buttons one at a time.", "status": "First Draft", "label": "Tom", "date": "1898-03-15", "type": "text"}, "body": "Tom sold the buttons one at a time so the fair would not notice. Each one bought a day."}, {"path": "Manuscript/02 Part Two/03 The Reading.md", "folder": "Manuscript/02 Part Two", "name": "The Reading", "fm": {"title": "The Reading", "synopsis": "Every name is read from the chapel steps. Hers is not among them.", "status": "To Do", "label": "The town", "date": "1898-04-05", "type": "text"}, "body": "Every name was read from the [[Chapel steps]], and hers was not among them. The town went home."}, {"path": "Manuscript/02 Part Two/04 The Inventory.md", "folder": "Manuscript/02 Part Two", "name": "The Inventory", "fm": {"title": "The Inventory", "synopsis": "They count everything in the house twice.", "status": "To Do", "label": "Mara", "date": "1898-04-09", "type": "text"}, "body": "They counted everything in the house twice, and the tin was not there. Mara said nothing about the crossing."}, {"path": "Manuscript/03 Part Three/01 Ashes.md", "folder": "Manuscript/03 Part Three", "name": "Ashes", "fm": {"title": "Ashes", "synopsis": "What is left of the house fits into a cart.", "status": "To Do", "label": "The town", "date": "1898-11-04", "type": "text"}, "body": "What was left of the house fitted into the cart. The wood took the rest."}, {"path": "Manuscript/03 Part Three/02 Last Stall.md", "folder": "Manuscript/03 Part Three", "name": "Last Stall", "fm": {"title": "Last Stall", "synopsis": "Tom keeps the stall one more he house."}, {"path": "Places/Stillwater.md", "folder": "Places", "name": "Stillwater", "fm": {"title": "Stillwater", "type": "setting"}, "body": "A ford below the mountains. The ferry ran until the flood."}, {"path": "Places/The house.md", "folder": "Places", "name": "The house", "fm": {"title": "The house", "type": "setting"}, "body": "Where the story opens and ends."}, {"path": "Research/Father leaves.md", "folder": "Research", "name": "Father leaves", "fm": {"title": "Father leaves", "date": "1896-02", "type": "event"}, "body": "Before the story starts."}, {"path": "Research/The flood.md", "folder": "Research", "name": "The flood", "fm": {"title": "The flood", "date": "1897-11-03", "type": "event"}, "body": "The water reached the chapel steps by nightfall."}];

/* ---- tour: Gall steps out of the word ---- */
const STOPS = [
  ["#binder", "The binder", "Your project as folders and scenes, in manuscript order, with a word count on every row. The order lives in the file names, so nothing is hidden in a database."],
  ["#sheet", "The page", "Where you write. Every open scene is a tab. The title and the facts above the text come from the scene's own notes; the text saves itself as you go."],
  ["#inspector", "The inspector", "Everything about the scene you are on: synopsis, status, date, and snapshots. Take one before a risky rewrite and watch the number move."],
  ["#btn-search", "Search or command", "Press ⌘K to find any scene or any command by name."],
  ["#btn-settings", "Settings", "Light or dark, Desk or Classic, five looks, the page's paper and type size, and Gall's colour and outfit."],

const tour = (() => {
  const T = $("#tour"), cut = T.querySelector(".cut"), ring = T.querySelector(".ring"), card = T.querySelector(".tcard"), guide = T.querySelector(".guide");
  let step = null, move = 0, at = null, stops = [];
  const RIDE = 900;
  const rel = el => { const a = app.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - a.left, y: r.top - a.top, w: r.width, h: r.height }; };

  function setGuide(p, ms) { guide.style.transitionDuration = ms + "ms"; guide.classList.toggle("ride", ms > 0); guide.classList.toggle("flipx", at && p.x < at.x); guide.style.transform = `translate(${p.x}px,${p.y}px)`; at = p; if (ms) setTimeout(() => guide.classList.remove("ride"), ms); }
  function homePt() { const r = rel(home); return { x: r.x + r.w / 2, y: r.y + r.h * 0.62 }; }
  function box(i) { const el = $(stops[i][0]); if (!el) return null; const r = rel(el), a = app.getBoundingClientRect(), pad = 8; const x = Math.max(3, r.x - pad), y = Math.max(3, r.y - pad); return { x, y, w: Math.min(a.width - 3, r.x + r.w + pad) - x, h: Math.min(a.height - 3, r.y + r.h + pad) - y }; }
  function landing(r) { const a = app.getBoundingClientRect(), x = Math.max(24, Math.min(r.x + r.w - 12, a.width - 24)); return r.y > 64 ? { x, y: r.y - 14 } : { x, y: Math.min(r.y + r.h + 18, a.height - 24) }; }
  function place(i) {
    const r = box(i); if (!r) return; const a = app.getBoundingClientRect();
    for (const b of [cut, ring]) Object.assign(b.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
    const [, title, text] = stops[i];
    card.innerHTML = `<div class="eyebrow"><span>Oakfall, the tour</span><span>${String(i + 1).padStart(2, "0")} / ${String(stops.length).padStart(2, "0")}</span></div><div class="tt">${title}</div><p>${text}</p><div class="trow"><div class="dots">${stops.map((_, d) => `<i class="${d === i ? "on" : ""}"></i>`).join("")}</div><button class="tbtn" id="tb" ${i === 0 ? "disabled" : ""}>Back</button><button class="tbtn next" id="tn">${i + 1 < stops.length ? "Next" : "Done"}</button></div>`;
    card.querySelector("#tb").onclick = back; card.querySelector("#tn").onclick = next;
    const cw = Math.min(320, a.width - 24), ch = card.offsetHeight, m = 12, gap = 20;
    const tries = [{ x: r.x + r.w + gap, y: r.y }, { x: r.x, y: r.y + r.h + gap }, { x: r.x - cw - gap, y: r.y }, { x: r.x, y: r.y - ch - gap }];
    let p = tries.find(t => t.x >= m && t.x + cw <= a.width - m && t.y >= m && t.y + ch <= a.height - m && !(t.x < r.x + r.w && t.x + cw > r.x && t.y < r.y + r.h && t.y + ch > r.y));
    if (!p) p = { x: Math.max(m, Math.min(a.width - cw - m, r.x + r.w - cw - 16)), y: Math.max(m, Math.min(a.height - ch - m, r.y + r.h - ch - 16)) };
    card.style.left = p.x + "px"; card.style.top = p.y + "px";

  }
  function go(i) {
    move++; const my = move; step = i; T.classList.remove("lit");
    const r = box(i); if (!r) return; setGuide(landing(r), reduced() ? 0 : RIDE);
    const reveal = () => { if (move !== my) return; place(i); T.classList.add("lit"); };

  }
  function start(i = 0) {
    if (state.focus) toggleFocus();
